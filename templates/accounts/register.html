{% extends 'base.html' %}
{% block title %}Register • LPU Nexus{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card card-nx p-4">
      <h3 class="mb-3">Create your account</h3>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Full name *</label>
          <input type="text" name="full_name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email *</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Registration No.</label>
            <input type="text" name="registration_number" class="form-control">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Year</label>
            <input type="text" name="year" class="form-control" placeholder="1 / 2 / 3 / 4">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Department</label>
          <input type="text" name="department" class="form-control" placeholder="CSE / ECE / ...">
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Password *</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Confirm Password *</label>
            <input type="password" name="confirm_password" class="form-control" required>
          </div>
        </div>
        <button class="btn btn-nx w-100">Register</button>
      </form>
      <p class="mt-3 mb-0 text-center small">
        Already have an account? <a href="{% url 'accounts:login' %}">Log in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
