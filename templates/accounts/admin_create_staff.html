{% extends 'base.html' %}
{% block title %}Create Staff • LPU Nexus{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card card-nx p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Create Staff Account</h4>
        <a href="{% url 'accounts:admin_dashboard' %}" class="btn btn-sm btn-outline-secondary">Back</a>
      </div>

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Full Name *</label>
          <input type="text" name="full_name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email *</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Department</label>
            <input type="text" name="department" class="form-control"
                   placeholder="Electrical / Wi-Fi / Hostel...">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Designation</label>
            <input type="text" name="designation" class="form-control"
                   placeholder="Technician / Warden / ...">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Phone</label>
          <input type="text" name="phone" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Temporary Password *</label>
          <input type="text" name="password" class="form-control" required minlength="6"
                 placeholder="Share with staff member">
          <div class="form-text">Staff can change it later.</div>
        </div>
        <button class="btn btn-nx w-100">Create Staff Account</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
